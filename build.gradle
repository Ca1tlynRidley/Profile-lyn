plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'PROFILE-lyn' }

repositories {
    // Build/publish the separate ECO-API-lyn project once before building PROFILE.
    // -Dmaven.repo.local=/path/to/repository can select an isolated local Maven cache.
    mavenLocal()
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly("dev.lyn:eco-api-lyn:${eco_api_version}") {
        // Optional integration: compile against ECO without adding it to PROFILE's runtime.
        transitive = false
    }
    testImplementation("dev.lyn:eco-api-lyn:${eco_api_version}") { transitive = false }
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
def editorManifest = layout.buildDirectory.file('generated/editor/editor-assets.txt')
tasks.register('generateEditorManifest') {
    inputs.dir('editor/dist')
    outputs.file(editorManifest)
    doLast {
        def directory = file('editor/dist').toPath()
        def names = fileTree('editor/dist').files.collect {
            directory.relativize(it.toPath()).toString().replace('\\', '/')
        }.sort()
        def output = editorManifest.get().asFile
        output.parentFile.mkdirs()
        output.setText(names.join('\n') + '\n', 'UTF-8')
    }
}
processResources {
    dependsOn tasks.named('generateEditorManifest')
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
    from('editor/dist') { into 'profile-studio-editor' }
    from(editorManifest) { into 'profile-studio-editor' }
}
test { useJUnitPlatform() }
jar { from('LICENSE') }
